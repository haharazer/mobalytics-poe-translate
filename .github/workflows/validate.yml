name: Validate extension

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Check JavaScript syntax
        run: |
          node --check src/translation-core.js
          node --check src/content.js
          node --check popup/popup.js

      - name: Validate manifest and runtime files
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const files = [
            manifest.action.default_popup,
            ...Object.values(manifest.icons),
            ...Object.values(manifest.action.default_icon),
            ...manifest.content_scripts.flatMap((script) => script.js),
          ];
          for (const file of files) {
            if (!fs.existsSync(file)) throw new Error(`Missing runtime file: ${file}`);
          }
          require("./data/poe1-skill-gems.js");
          if (globalThis.POE1_SKILL_GEMS.length !== 812) {
            throw new Error("Expected 812 PoE 1 skill gem entries.");
          }
          console.log(`Validated ${files.length} references and 812 dictionary entries.`);
          NODE
